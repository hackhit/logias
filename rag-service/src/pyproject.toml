[project]
name = "rag-service"
version = "0.1.0"
description = "Microservicio RAG privado de punta a punta"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.8.0",
    "asyncpg>=0.29.0",
    "polars>=0.20.0",
    "pdfplumber>=0.11.0",
    "onnxruntime>=1.17.0",
    "llama-cpp-python>=0.2.60",
    "streamlit>=1.35.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "passlib>=1.7.4",
    "bcrypt>=4.1.0",
    "numpy>=1.26.0",
    "tokenizers>=0.19.1",
    "openpyxl>=3.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
