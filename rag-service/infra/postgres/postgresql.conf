# Archivo de configuración de PostgreSQL optimizado para rendimiento y seguridad

# Conectividad
listen_addresses = '*'
max_connections = 100

# Memoria y recursos
shared_buffers = 128MB
temp_buffers = 8MB
work_mem = 4MB
maintenance_work_mem = 64MB

# Escritura en disco
fsync = on
synchronous_commit = on

# Log de consultas lentas
log_min_duration_statement = 2000 # Registrar cualquier consulta que tome más de 2 segundos

# Configuración regional
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Deshabilitar variables no seguras si fuera necesario
# Pero permitiremos custom settings para RLS de forma explícita
# 'app.current_user_role', 'app.current_user_id', 'app.fecha_referencia_mora'
