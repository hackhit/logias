worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Definir upstream para el servicio de Litestar (RAG API)
    upstream rag_api_upstream {
        server litestar-api:8000;
    }

    # Definir upstream para el Node.js/Express actual
    # Dado que el docker-compose de la raíz corre en el puerto 3000,
    # configuramos el proxy para enrutar de forma no invasiva.
    upstream node_app_upstream {
        server host.docker.internal:3000;
    }

    server {
        listen 8080;
        server_name localhost;

        # Enrutar peticiones de chat y autenticación al microservicio RAG (Python/Litestar)
        location /chat/ {
            proxy_pass http://rag_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://rag_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Enrutar todo lo demás al Node.js/Express original existente
        location / {
            # Se enruta al Node.js (se asume que corre localmente en el puerto 3000 o se documenta)
            proxy_pass http://node_app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Evitar fallos si el Node no está activo en el momento de la demo
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }
    }
}
